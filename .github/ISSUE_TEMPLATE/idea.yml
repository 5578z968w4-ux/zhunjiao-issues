name: 功能建議
description: 希望準交新增或調整的地方
labels: ["建議"]
body:
  - type: textarea
    id: need
    attributes:
      label: 想解決的情況
      description: 現在在現場遇到什麼不方便
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 希望的做法
  - type: checkboxes
    id: privacy
    attributes:
      label: 確認
      options:
        - label: 內容沒有帳號密碼、準交網址、現場密鑰、真實工單或可辨識個人／公司的資料
          required: true
